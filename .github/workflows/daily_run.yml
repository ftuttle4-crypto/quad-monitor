name: Quad Risk K2 Daily Monitor

on:
  schedule:
    # "Double-Tap" Execution: Runs at 19:45 UTC and 20:45 UTC 
    # to catch exactly 3:45 PM Eastern time, regardless of Daylight Saving Time.
    # Runs Monday (1) through Friday (5).
    - cron: '45 19,20 * * 1-5'
    
  # Allows you to manually trigger the workflow from the GitHub Actions tab for testing
  workflow_dispatch: 

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs the exact packages needed for monitor.py
        pip install yfinance pandas numpy tzdata

    - name: Execute Monitor Script
      env:
        # Maps your secure GitHub Secrets into the server environment
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: |
        python monitor.py
